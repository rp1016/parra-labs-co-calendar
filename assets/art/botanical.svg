<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="bot-title">
  <title id="bot-title">Flores botánicas</title>
  <defs>
    <filter id="wc" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="halo" cx=".5" cy=".48" r=".5">
      <stop offset="0" stop-color="#C9A86A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="600" cy="470" rx="430" ry="360" fill="url(#halo)"/>

