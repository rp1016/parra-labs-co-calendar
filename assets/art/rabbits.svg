        <ellipse cx="12" cy="-50" rx="14" ry="40" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.4" transform="rotate(10)"/>
        <ellipse cx="-18" cy="-52" rx="6" ry="30" fill="#D9A6A0" fill-opacity=".4" transform="rotate(-14)"/>
        <ellipse cx="12" cy="-50" rx="6" ry="30" fill="#D9A6A0" fill-opacity=".4" transform="rotate(10)"/>
        <circle cx="0" cy="0" r="34" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.6"/>
        <ellipse cx="26" cy="8" rx="16" ry="13" fill="#E8DCC8" fill-opacity=".6" stroke="#A98F72" stroke-opacity=".35" stroke-width="2"/>
        <circle cx="12" cy="-8" r="4" fill="#5A4A3A"/>
        <circle cx="34" cy="6" r="4" fill="#B07C77"/>
        <g stroke="#A98F72" stroke-opacity=".45" stroke-width="1.8">
