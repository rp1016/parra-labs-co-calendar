    <g transform="translate(760 632) scale(.74) scale(-1 1)">
      <ellipse cx="0" cy="62" rx="104" ry="18" fill="#7C8B63" fill-opacity=".12"/>
      <ellipse cx="-74" cy="6" rx="20" ry="18" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".4" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="66" ry="50" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.6"/>
      <ellipse cx="-20" cy="18" rx="42" ry="38" fill="#DCCDB4" fill-opacity=".4" stroke="#A98F72" stroke-opacity=".3" stroke-width="2"/>
      <ellipse cx="-2" cy="48" rx="32" ry="12" fill="#DCCDB4" fill-opacity=".5" stroke="#A98F72" stroke-opacity=".35" stroke-width="2"/>
