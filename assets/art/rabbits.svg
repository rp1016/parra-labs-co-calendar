    <g transform="translate(420 590)">
      <ellipse cx="0" cy="62" rx="104" ry="18" fill="#7C8B63" fill-opacity=".12"/>
      <ellipse cx="-74" cy="6" rx="20" ry="18" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".4" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="70" ry="52" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.6"/>
      <ellipse cx="-22" cy="18" rx="44" ry="40" fill="#DCCDB4" fill-opacity=".4" stroke="#A98F72" stroke-opacity=".3" stroke-width="2"/>
      <ellipse cx="-2" cy="50" rx="34" ry="13" fill="#DCCDB4" fill-opacity=".5" stroke="#A98F72" stroke-opacity=".35" stroke-width="2"/>
      <ellipse cx="34" cy="44" rx="15" ry="10" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".3" stroke-width="2"/>
      <g transform="translate(62 -44)">
