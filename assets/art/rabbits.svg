        <ellipse cx="14" cy="-48" rx="13" ry="38" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.4" transform="rotate(8)"/>
        <ellipse cx="-16" cy="-50" rx="5" ry="28" fill="#D9A6A0" fill-opacity=".4" transform="rotate(-18)"/>
        <ellipse cx="14" cy="-48" rx="5" ry="28" fill="#D9A6A0" fill-opacity=".4" transform="rotate(8)"/>
        <circle cx="0" cy="0" r="32" fill="#E8DCC8" fill-opacity=".55" stroke="#A98F72" stroke-opacity=".45" stroke-width="2.6"/>
        <ellipse cx="24" cy="8" rx="15" ry="12" fill="#E8DCC8" fill-opacity=".6" stroke="#A98F72" stroke-opacity=".35" stroke-width="2"/>
        <circle cx="12" cy="-8" r="3.8" fill="#5A4A3A"/>
        <circle cx="32" cy="6" r="3.8" fill="#B07C77"/>
      </g>
    </g>

    <!-- butterflies -->
    <g transform="translate(300 360)" fill="#C98F8B" fill-opacity=".35" stroke="#96605C" stroke-opacity=".35" stroke-width="1.5">
      <ellipse cx="-11" cy="-6" rx="13" ry="10" transform="rotate(-24 -11 -6)"/>
      <ellipse cx="11" cy="-6" rx="13" ry="10" transform="rotate(24 11 -6)"/>
      <ellipse cx="-8" cy="8" rx="9" ry="7" transform="rotate(-16 -8 8)"/>
      <ellipse cx="8" cy="8" rx="9" ry="7" transform="rotate(16 8 8)"/>
    </g>
    <g transform="translate(1010 470) scale(.8)" fill="#C9A86A" fill-opacity=".35" stroke="#9A7A44" stroke-opacity=".3" stroke-width="1.5">
      <ellipse cx="-11" cy="-6" rx="13" ry="10" transform="rotate(-24 -11 -6)"/>
      <ellipse cx="11" cy="-6" rx="13" ry="10" transform="rotate(24 11 -6)"/>
      <ellipse cx="-8" cy="8" rx="9" ry="7" transform="rotate(-16 -8 8)"/>
      <ellipse cx="8" cy="8" rx="9" ry="7" transform="rotate(16 8 8)"/>
    </g>
  </g>
</svg>
