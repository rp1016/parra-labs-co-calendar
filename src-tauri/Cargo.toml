[package]
name = "parritalabs-calendar"
version = "0.2.1"
description = "CalendarPRO by Parrita Labs"
authors = ["ParritaLabs <https://parritalabs.com>"]
license = "MIT"
homepage = "https://parritalabs.com"
repository = "https://parritalabs.com"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "calendar_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
